<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12161c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ticket Vault</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <p class="eyebrow">Offline tickets</p>
        <h1>Ticket Vault</h1>
      </div>
    </div>
    <button type="button" class="ghost-btn" id="newTripBtn">New trip</button>
  </header>

  <main>
    <section id="dashboard" class="panel">
      <div class="section-head">
        <h2>Trips</h2>
        <p id="tripCount">Loading</p>
      </div>
      <button type="button" class="primary-btn hidden" id="installBtn">Install App</button>
      <ul id="tripList" class="trip-list"></ul>
      <p id="emptyState" class="empty hidden">No trips stored yet. Add a trip to keep tickets on this device.</p>
    </section>

    <section id="tripFormPanel" class="panel hidden">
      <div class="section-head">
        <h2 id="formTitle">Add trip</h2>
        <button type="button" class="text-btn" id="cancelFormBtn">Cancel</button>
      </div>
      <form id="tripForm">
        <label>
          Trip name
          <input type="text" name="name" required maxlength="80" placeholder="Tokyo weekender" autocomplete="off">
        </label>
        <div class="row">
          <label>
            Start date
            <input type="date" name="startDate" required>
          </label>
          <label>
            End date
            <input type="date" name="endDate" required>
          </label>
        </div>
        <fieldset>
          <legend>First segment</legend>
          <div class="row">
            <label>
              Direction
              <select name="direction" required>
                <option value="outbound">Outbound</option>
                <option value="inbound">Inbound</option>
                <option value="local">Local</option>
              </select>
            </label>
            <label>
              Group size
              <input type="number" name="groupSize" min="1" max="99" value="1" required>
            </label>
          </div>
          <label class="file-label">
            Tickets
            <input type="file" name="tickets" id="ticketFiles" accept="application/pdf,image/*" multiple>
            <span id="fileHint" class="hint">PDF or images, stored on this device</span>
          </label>
        </fieldset>
        <button type="submit" class="primary-btn">Save trip</button>
      </form>
    </section>

    <section id="tripDetail" class="panel hidden">
      <div class="section-head">
        <button type="button" class="text-btn" id="backBtn">All trips</button>
        <button type="button" class="danger-btn" id="deleteTripBtn">Delete</button>
      </div>
      <header class="detail-head">
        <h2 id="detailName"></h2>
        <p id="detailDates"></p>
      </header>
      <form id="segmentForm" class="compact-form">
        <h3>Add segment</h3>
        <div class="row">
          <label>
            Direction
            <select name="direction" required>
              <option value="outbound">Outbound</option>
              <option value="inbound">Inbound</option>
              <option value="local">Local</option>
            </select>
          </label>
          <label>
            Group size
            <input type="number" name="groupSize" min="1" max="99" value="1" required>
          </label>
        </div>
        <label class="file-label">
          Tickets
          <input type="file" name="tickets" accept="application/pdf,image/*" multiple>
        </label>
        <button type="submit" class="primary-btn">Add segment</button>
      </form>
      <ul id="segmentList" class="segment-list"></ul>
    </section>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
